resources:
  jobs:
    hello_world_job:
      name: ${bundle.name}_hello_world

      tasks:
        - task_key: ingest_bronze

          spark_python_task:
            python_file: ../src/ingestion/ingest_bronze.py
          environment_key: default
        
        - task_key: create_silver

          depends_on:
            - task_key: ingest_bronze
          spark_python_task:
            python_file: ../src/transformations/spark_cleaned.py
          environment_key: default

        - task_key: create_gold
          depends_on:
              - task_key: create_silver
          spark_python_task:
              python_file: ../src/gold/create_gold.py
          environment_key: default  

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            